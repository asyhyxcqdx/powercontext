    - data:
        code: "\nRULES = {\n    'pet': ['猫', '狗', '仓鼠', '鹦鹉', '宠物', '喵'],\n    'study':\
          \ ['作业', '学习', '考试', '复习', '论文', '图书馆', '上课', '背单词'],\n    'work': ['上班',\
          \ '老板', '摸鱼', '会议', '打工', '工作', '加班'],\n    'digital': ['键盘', '代码', '电脑',\
          \ '编程', '下载', '手机', '网络', 'wifi', '报错', 'ai'],\n    'social': ['朋友', '聊天',\
          \ '消息', '社交', '群聊', '聚会', '朋友圈'],\n    'life': ['起床', '睡觉', '外卖', '吃饭',\
          \ '洗澡', '拖延', '衣服', '冰箱', '房间'],\n}\n\n\ndef main(query: str) -> dict:\n\
          \    text = (query or '')[:500].lower()\n    scored = []\n\n    for category,\
          \ terms in RULES.items():\n        hits = sum(\n            2 if len(term)\
          \ > 1 else 1\n            for term in terms\n            if term.lower()\
          \ in text\n        )\n        if category == 'pet' and any(\n          \
          \  term in text for term in ('猫', '狗', '仓鼠', '鹦鹉')\n        ):\n       \
          \     hits += 3\n        if hits > 0:\n            scored.append((category,\
          \ hits))\n\n    scored.sort(\n        key=lambda x: (-x[1], list(RULES).index(x[0]))\n\
          \    )\n\n    categories = [cat for cat, _ in scored[:2]] or ['life', 'social']\n\
          \n    names = ', '.join(\"'\" + cat + \"'\" for cat in categories)\n   \
          \ order = ' '.join(\n        \"WHEN '\" + cat + \"' THEN \" + str(i)\n \
          \       for i, cat in enumerate(categories)\n    )\n\n    sql_select = (\n\
          \        'SELECT case_id, category, title, summary, tags, verdict, twist\
          \ '\n        'FROM cyber_case_catalog WHERE category IN (' + names + ')\
          \ '\n        'ORDER BY CASE category ' + order + ' ELSE 99 END, case_id\
          \ LIMIT 3'\n    )\n\n    sql_log = (\n        'INSERT INTO cyber_case_plays\
          \ (case_id) '\n        'SELECT case_id FROM cyber_case_catalog WHERE category\
          \ IN (' + names + ') '\n        'ORDER BY CASE category ' + order + ' ELSE\
          \ 99 END, case_id LIMIT 1'\n    )\n\n    return {\n        'sql_select':\
          \ sql_select,\n        'sql_log': sql_log,\n        'category_hint': ','.join(categories)\n\
          \    }\n"
        code_language: python3
        outputs:
          category_hint:
            children: null
            type: string
          sql_log:
            children: null
            type: string
          sql_select:
            children: null
            type: string
        selected: false
        title: Code
        type: code
        variables:
