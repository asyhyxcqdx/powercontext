services:
  seekdb:
    image: oceanbase/seekdb:latest
    restart: unless-stopped
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD:-litmemory-demo}
    ports:
      - "2881:2881"
    volumes:
      - seekdb-data:/var/lib/oceanbase

  powercontext:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /srv
    environment:
      POWERCONTEXT_HOME: /data
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: "8000"
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends git &&
             pip install --no-cache-dir 'powercontext[cli,server] @ git+https://github.com/oceanbase/powercontext.git@archive/powercontext-main' &&
             powercontext server run"
    ports:
      - "8000:8000"
    volumes:
      - powercontext-data:/data

  litmemory:
    build: .
    restart: unless-stopped
    depends_on:
      - seekdb
      - powercontext
    environment:
      SEEKDB_HOST: seekdb
      SEEKDB_PORT: "2881"
      SEEKDB_USER: root
      SEEKDB_PASSWORD: ${SEEKDB_PASSWORD:-litmemory-demo}
      SEEKDB_DATABASE: litmemory
      SEEKDB_COLLECTION: litmemory_notes
      POWERCONTEXT_URL: http://powercontext:8000
      POWERCONTEXT_SCOPE: project:litmemory:demo
      LITMEMORY_AUTOSEED: "1"
    ports:
      - "8765:8765"
    volumes:
      - litmemory-data:/app/data

volumes:
  seekdb-data:
  powercontext-data:
  litmemory-data:
